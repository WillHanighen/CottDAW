[alias]
# Build + bundle CottSynth.vst3 for redistribution (output under target/bundled/).
bundle-synth = "run -p cott-xtask --release -- bundle cott-synth --release"
# Debug bundle (faster iteration while developing the plugin).
bundle-synth-debug = "run -p cott-xtask -- bundle cott-synth"
# CottFilter (stereo LP/HP effect).
bundle-filter = "run -p cott-xtask --release -- bundle cott-filter --release"
bundle-filter-debug = "run -p cott-xtask -- bundle cott-filter"
# CottVinyl (stereo vinyl wear effect).
bundle-vinyl = "run -p cott-xtask --release -- bundle cott-vinyl --release"
bundle-vinyl-debug = "run -p cott-xtask -- bundle cott-vinyl"
# CottDrums (analog pad drum machine).
bundle-drums = "run -p cott-xtask --release -- bundle cott-drums --release"
bundle-drums-debug = "run -p cott-xtask -- bundle cott-drums"
# CottBass (mono sub).
bundle-bass = "run -p cott-xtask --release -- bundle cott-bass --release"
bundle-bass-debug = "run -p cott-xtask -- bundle cott-bass"
# CottKeys (keys / bells / pluck).
bundle-keys = "run -p cott-xtask --release -- bundle cott-keys --release"
bundle-keys-debug = "run -p cott-xtask -- bundle cott-keys"
