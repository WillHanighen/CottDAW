[workspace]
resolver = "2"
members = [
    "crates/cott-core",
    "crates/cott-ipc",
    "crates/cott-daw",
    "crates/cott-vst-worker",
    "crates/cott-synth-dsp",
    "crates/cott-synth",
    "crates/cott-filter-dsp",
    "crates/cott-filter",
    "crates/cott-whistle-dsp",
    "crates/cott-whistle",
    "crates/cott-plugin-ui",
    "crates/cott-xtask",
]
default-members = ["crates/cott-daw"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Cottage"]

[workspace.dependencies]
cott-core = { path = "crates/cott-core" }
cott-ipc = { path = "crates/cott-ipc" }
cott-synth-dsp = { path = "crates/cott-synth-dsp" }
cott-filter-dsp = { path = "crates/cott-filter-dsp" }
cott-whistle-dsp = { path = "crates/cott-whistle-dsp" }
cott-plugin-ui = { path = "crates/cott-plugin-ui" }

# Pinned in one place so every first-party plugin links the same egui/nih-plug.
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", default-features = false, features = ["vst3"] }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
slotmap = { version = "1", features = ["serde"] }
petgraph = "0.7"
rtrb = "0.3"
midly = "0.5"
symphonia = { version = "0.5", features = ["mp3", "flac", "wav", "ogg", "aac", "isomp4"] }
# Symphonia 0.5 has no native Opus decoder; 0.2.x matches symphonia 0.5.
symphonia-adapter-libopus = "0.2"
rubato = "0.16"
cpal = { version = "0.18", features = ["pipewire"] }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11"] }
egui = "0.31"
rfd = "0.15"
hound = "3.5"
parking_lot = "0.12"
crossbeam-channel = "0.5"
nix = { version = "0.29", features = ["event", "fs", "mman", "socket", "uio", "process", "signal"] }
bincode = "1"
bytemuck = { version = "1", features = ["derive"] }
truce-rack-core = "1.1"
truce-rack-vst3 = "1.1"
tempfile = "3"
directories = "6"
x11-dl = "2.21"
bitflags = { version = "2", features = ["serde"] }
smallvec = { version = "1", features = ["serde"] }
indexmap = { version = "2", features = ["serde"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

# Call Linux VST3 ModuleEntry before GetPluginFactory (needed for yabridge).
[patch.crates-io]
truce-rack-vst3 = { path = "vendor/truce-rack-vst3" }

[profile.release]
lto = "thin"
codegen-units = 1